<ion-content [fullscreen]="true" [scrollY]="false" class="map-content">
  <div class="map-back-action" (click)="goback()">
    <ion-button class="map-back-button" color="primary">
      <ion-icon name="chevron-back-circle-outline" style="margin-right:5px;"></ion-icon>
      {{ ui.instant('Action.Back') }}<!--返回-->
    </ion-button>
  </div>

  
  <div class="map-shell">
    <div class="map-wrapper" id="map" #lifeMap></div>
<!-- 
    <div class="map-overlay map-overlay-top">
      <div class="map-panel map-summary">
        <div class="map-summary-title">{{ author || 'Poet' }}</div>
        <div class="map-summary-subtitle" *ngIf="hasLifeData">Life timeline map</div>
        <div class="map-summary-subtitle" *ngIf="!hasLifeData">No life location data</div>
      </div>
    </div> -->

    <div class="map-overlay map-overlay-bottom">
      <!-- <div class="map-panel life-detail" *ngIf="selectedLife">
        <div><b>11年份:</b> {{ formatDisplayYear(selectedLife.year) }}<span *ngIf="selectedLife.old!=null">（{{selectedLife.old}}岁）</span></div>
        <div><b>22年号:</b> {{ selectedLife.reign }}</div>
        <div><b>33地点:</b> {{ selectedLife.location }}</div>
        <div><b>44事件:</b> {{ selectedLife.event }}</div>
      </div> -->
      <div class="map-panel life-detail" *ngIf="selectedLife&&selectedLife.poem">
        <ion-label (click)="play(selectedLife.poem)">
          <h2 style="margin-bottom:10px;">{{ selectedLife.poem.sample }}</h2>
          <span>《{{ selectedLife.poem.title }}》</span>
          <span>{{ selectedLife.poem.note }}</span>
        </ion-label>
        <div>
          <b></b> 
        </div>
      </div>

      <div class="map-panel timeline-panel" *ngIf="hasLifeData"
      style="background:rgba(255,255,255,0.3);">
        <!-- <div class="year-line">
          <span>{{ formatDisplayYear(minYear) }}111</span>
          <strong>{{ selectedYearLabel }}222</strong>
          <span>{{ formatDisplayYear(maxYear) }}333</span>
        </div> -->

        <div class="timeline-head">
          <div class="timeline-author">
            <img
              class="timeline-author-avatar"
              [src]="authorAvatarUrl"
              alt="author avatar"
              onerror="this.src='assets/img/default.jpg'">

            <div class="timeline-author-meta">
              <div class="timeline-author-name" [style.fontSize]="data.zoom(17)">{{ author || 'Poet' }}</div>
              <div class="timeline-author-age" [style.fontSize]="data.zoom(17)"> · {{ selectedAgeLabel }} · {{ formatRangePin(selectedYear) }}年</div>
            </div>
          </div>

          <div class="timeline-actions">
            <ion-button
              size="small"
              fill="solid"
              [color]="canGoPrevious ? 'primary' : 'medium'"
              [disabled]="!canGoPrevious"
              aria-label="Previous"
              (click)="goToPreviousYear()">
              <ion-icon name="chevron-back-outline"></ion-icon>
            </ion-button>
            <ion-button
              size="small"
              fill="solid"
              [color]="canGoNext ? 'primary' : 'medium'"
              [disabled]="!canGoNext"
              aria-label="Next"
              (click)="goToNextYear()">
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </ion-button>
          </div>
        </div>

        <ion-range
          style="--background:transparent;"
          [min]="minYear"
          [max]="maxYear"
          [value]="selectedYear"
          [step]="0.1"
          [pin]="true"
          [pinFormatter]="formatRangePin"
          [ticks]="true" [snaps]="true"
          color="primary"
          (ionInput)="onYearChanged($event)">
        </ion-range>
      </div>

    </div>
  </div>
</ion-content>
