<ion-header [translucent]="true">
  <ion-toolbar style="padding-inline-start:5px;
      padding-inline-end:10px;padding-top:30px;"
      [style.paddingTop]="ui.isAndroid ? '45px' : '30px'">
    <ion-buttons style="display:flex;justify-content:center;
      width:fit-content;height:25px;float:left;
      padding:15px 15px 15px 5px;
      border-radius: 15px;"
      (click)="goback()">
      <ion-button>
        <ion-icon name="chevron-down-circle-outline" style="margin-right:5px;"></ion-icon>
        {{ ui.instant('Action.Back') }}<!--返回-->
      </ion-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button (click)="share()" [disabled]="!cs">
        <ion-icon name="share-social-outline" style="margin-right:5px;"></ion-icon>
        {{ ui.instant('Action.Share') }}<!--分享-->
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [scrollY]="true">
  <swiper-container #slideSwiperArticle *ngIf="slidesJsonData"
    [loop]="canLoop" navigation="false" scrollbar="false"
    [autoplay]="slideAutoplay" speed="1000" style="padding-top:50px;">
    <swiper-slide *ngFor="let s of slidesJsonData.slides;index as i">
      <!--(click)="share(s)" -->
      <div style="display: flex;flex-direction: column;justify-content: center;"
      id="open-modal{{i}}">
        
        


        <app-sf 
        content="{{s.title.join('')}}" 
        name="{{s.author}}" 
        bg="{{s.bg}}" 
        [showbgbar]="s.showbgbar"
        tpl="{{s.tpl}}"></app-sf>


        <div style="text-align: center;padding:30px 0;"
        [style.fontSize]="data.zoom(22)"
        (click)="search(s.tag)"
        >
          {{s.tag}}
        </div>

        <div *ngFor="let t of s.title" 
          style="text-align: center;padding:5px 0;"
          [style.fontSize]="data.zoom(20)"
          (click)="openPoemById(s.id)"
          >
          {{t}}
        </div> 

        <div style="text-align: center;padding:30px 0;"
        [style.fontSize]="data.zoom(16)">
          {{s.sub}}
        </div>
<!-- 
        <div style="padding:30px 0;"
        [style.fontSize]="data.zoom(16)">
          评：<br><br>
          {{s.desc}} 
        </div> -->
      </div>

    </swiper-slide>
  </swiper-container>
  
</ion-content>
