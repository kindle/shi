<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goback()">
        <ion-icon name="chevron-back-outline" color="medium"></ion-icon>
      </ion-button>
    </ion-buttons>

    <app-button-end [p]="cs" page="slidearticle" slot="end" 
    *ngIf="cs"
    (click)="stopSlideAutoplay()"></app-button-end>
<!--     
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="share-social-outline" color="medium"></ion-icon>
      </ion-button>
    </ion-buttons> -->
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"></ion-title>
    </ion-toolbar>
  </ion-header>
  <swiper-container #slideSwiper *ngIf="slidesJsonData"
    [loop]="true" navigation="false" scrollbar="false"
    [autoplay]="slideAutoplay" speed="1000">
    <swiper-slide *ngFor="let s of slidesJsonData.slides;index as i">
      <!--(click)="share(s)" -->
      <div style="margin:40px 50px;display: flex;flex-direction: column;justify-content: center;"
      id="open-modal{{i}}">
        
        <div *ngFor="let t of s.title" 
          style="text-align: center;padding:5px 0;"
          [style.fontSize]="data.zoom(20)">
          {{t}}
        </div>

        <div style="text-align: center;padding:30px 0;"
        [style.fontSize]="data.zoom(16)">
          -{{s.sub}}
        </div>

        <div style="padding:30px 0;"
        [style.fontSize]="data.zoom(16)">
          译文：<br><br>
          {{s.desc}} 
        </div>
      </div>

    </swiper-slide>
  </swiper-container>
  
</ion-content>
