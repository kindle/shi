<ion-header>
  <ion-toolbar>
    <ion-buttons style="display:flex;justify-content:center;
      width:fit-content;height:25px;float:left;
      padding:15px 15px 15px 5px;
      border-radius: 15px;"
      (click)="goback()">
      <ion-button>
        <ion-icon name="chevron-down-circle-outline" style="margin-right:5px;"></ion-icon>
        {{ ui.instant('Action.Back') }}<!--返回-->
      </ion-button>
    </ion-buttons>
    <ion-title>{{ ui.instant('Action.Share') }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="preview-content">
  <div class="preview-stage" [class.is-rendering]="isRendering" (click)="viewPreviewImage()">
    <div *ngIf="isRendering" class="preview-loading-overlay">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
    <div
      *ngIf="previewDataUrl"
      #previewShell
      class="preview-style-shell"
      [class.no-style]="true"
      [style.background-image]="true ? 'none' : 'url(' + selectedStyleBg + ')'"
    >
      <img [src]="previewDataUrl" alt="share preview" class="preview-image" />
    </div>
    <div *ngIf="!previewDataUrl && renderError" class="preview-error">{{ renderError }}</div>
  </div>

  <div class="scroll">
    <div class="scroll-item"
      [class.selected]="selectedStyleId === template.key"
      *ngFor="let template of styleOptions"
      (click)="chooseStyle(template.key)">
      <div class="scroll-thumb">
        <img [src]="template.preview" alt="style preview" 
        (error)="template.preview='assets/img/default.jpg'; $any($event.target).src='assets/img/default.jpg'">
      </div>
      <div class="scroll-label" style="display: none;">{{ template.value }}</div>
    </div>
  </div>

  <ion-item lines="none">
      <ion-input
        [value]="editableBigTitle"
        placeholder="请输入诗词"
        (ionInput)="onBigTitleInput($event)"
      ></ion-input>
    </ion-item>

    <ion-item lines="none">
      <ion-input
        [value]="editableSmallTitle"
        placeholder="请输入作者和标题"
        (ionInput)="onSmallTitleInput($event)"
      ></ion-input>
    </ion-item>

    <!-- <ion-item lines="none" (click)="chooseBackground()">
      <ion-icon slot="start" name="image-outline"></ion-icon>
      <ion-text fill="solid">更换图片</ion-text>
    </ion-item> -->
    <div class="scroll">
      <div class="scroll-item"
        [class.selected]="selectedImageId === template.key"
        *ngFor="let template of imageOptions"
        (click)="chooseImage(template.key)">
        <div class="scroll-thumb">
          <img [src]="template.preview" alt="style preview" (error)="template.preview='assets/img/default.jpg'; $any($event.target).src='assets/img/default.jpg'">
        </div>
        <div class="scroll-label" style="display: none;">{{ template.value }}</div>
      </div>
    </div>


</ion-content>

<ion-toolbar>
  <div class="action-row action-row-right">
    <ion-button fill="solid" (click)="saveImage()" 
      style="--background: var(--ion-color-success); --color: white;">
      <ion-icon slot="start" name="checkmark-sharp" color="light"></ion-icon>
      {{ ui.instant('Action.Save') }}
    </ion-button>
    <ion-button fill="solid" color="light" (click)="shareImage()">
      <ion-icon slot="start" name="share-social-outline"></ion-icon>
      {{ ui.instant('Action.Share') }}
    </ion-button>
  </div>
</ion-toolbar>
