<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
        返回
      </ion-button>
    </ion-buttons>
    <ion-title>分享预览</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="preview-content">
  <div class="preview-stage" [class.is-rendering]="isRendering">
    <div *ngIf="isRendering" class="preview-loading-overlay">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
    <div
      *ngIf="previewDataUrl"
      #previewShell
      class="preview-style-shell"
      [class.no-style]="true"
      [style.background-image]="true ? 'none' : 'url(' + selectedStyleBg + ')'"
    >
      <img [src]="previewDataUrl" alt="share preview" class="preview-image" />
    </div>
    <div *ngIf="!previewDataUrl && renderError" class="preview-error">{{ renderError }}</div>
  </div>

  <div class="scroll">
    <div class="scroll-item"
      [class.selected]="selectedStyleId === template.key"
      *ngFor="let template of styleOptions"
      (click)="chooseStyle(template.key)">
      <div class="scroll-thumb">
        <img [src]="template.preview" alt="style preview">
      </div>
      <div class="scroll-label" style="display: none;">{{ template.value }}</div>
    </div>
  </div>

  <ion-item lines="none">
      <ion-input
        [value]="editableBigTitle"
        placeholder="请输入大标题"
        (ionInput)="onBigTitleInput($event)"
      ></ion-input>
    </ion-item>

    <ion-item lines="none">
      <ion-input
        [value]="editableSmallTitle"
        placeholder="请输入小标题"
        (ionInput)="onSmallTitleInput($event)"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" (click)="chooseBackground()">
      <ion-icon slot="start" name="image-outline"></ion-icon>
      <ion-text fill="solid">更换图片</ion-text>
    </ion-item>

</ion-content>

<ion-toolbar>
  <div class="action-row action-row-right">
    <ion-button fill="solid" color="medium" (click)="saveImage()">保存图片</ion-button>
    <ion-button fill="solid" color="primary" (click)="shareImage()">分享</ion-button>
  </div>
</ion-toolbar>
