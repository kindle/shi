<ion-card class="card card-gif" card-shrink
[style.width]="viewer ? 'auto' : 400 + 'px'"
  [style.margin]="viewer ? '0' : null"
  [style.borderRadius]="viewer ? '0' : null">
  <ion-card-content class="container"
  [style.height]="viewer ? '380px' : '380px'">
    <ion-card-subtitle class="card-text" style="z-index: 10;" *ngIf="!viewer"
    [style.marginTop]="viewer ? '20px' : null"
    [style.fontSize]="data.zoom(18)">{{sub}}</ion-card-subtitle>
    <ion-card-title class="card-text" style="z-index: 10;" *ngIf="!viewer"
    [style.fontSize]="data.zoom(28)">{{title}}</ion-card-title>
    <div class="butterflybox">
        <div class="butterfly">
            <div class="wing">
                <div class="bit"></div>
                <div class="bit"></div>
            </div>
            <div class="wing">
                <div class="bit"></div>
                <div class="bit"></div>
            </div>
        </div>
        <div class="shadow"></div>
    </div>
  </ion-card-content>
</ion-card>
