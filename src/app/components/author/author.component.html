<ion-header style="--background: translucent;" *ngIf="name">
  <ion-card-content style="display: flex;direction:row;padding-top:0;padding-bottom: 0;padding-left:15px;">
    <ion-buttons>
      <ion-card-title class="station-text" style="font-weight: bold;"
       [style.fontSize]="data.zoom(20)">{{name}}</ion-card-title>
      <ion-button *ngIf="source?.length>2">
        <ion-icon name="chevron-forward-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-card-content>
</ion-header>
<swiper-container swiper-touch *ngIf="source"
    style="margin-top:20px;margin-bottom: 20px;" class="swiper-container"
    space-between="10" direction="horizontal"
    slides-per-view="auto"
    centered-slides="false"
    slides-offset-before="20"
    slides-offset-after="10"
    >
  <swiper-slide *ngFor="let s of source; let i = index" class="swiper-slide" (click)="data.goToAuthor(s)" style="width:{{width+20}}px;">
    <div class="slide-in-right" [style.animation-delay]="i * 0.05 + 's'" style="display: flex; justify-content: center; flex-direction: column;width:120px;">
      <img width="{{width}}" height="{{width}}" style="border-radius: 10px;" 
        style="border-radius: 50%;"
        defaultImage="assets/img/default.jpg" 
        lazyLoad="https://reddah.blob.core.windows.net/msjjpoet/{{s}}.jpeg"  
        onerror="javascript:this.src='assets/img/default.jpg'" />
      <div class="card-text-style" style="text-align: center;margin-top: 10px;width: {{width}}px;"
       [style.fontSize]="data.zoom(16)"> 
        {{relation?relation[i]:''}} {{s}}
      </div>
    </div>
  </swiper-slide>
</swiper-container>
