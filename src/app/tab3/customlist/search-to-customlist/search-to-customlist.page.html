<ion-header>
    <ion-toolbar>
        <ion-title style="font-size:12px;width: 100%;white-space: normal;">
          {{ui.instant('Action.AddTo')}}"{{data.currentCollectLike.data.name}}"<!--添加到+name-->
        </ion-title>
        <!--<ion-buttons slot="end">
            <ion-button (click)="cancel()" [strong]="true">取消</ion-button>
        </ion-buttons>-->
    </ion-toolbar>
</ion-header>
<ion-content class="no-padding"><!--诗人、诗词以及更多内容-->
    <ion-searchbar placeholder="{{ui.instant('Search.Tab4')}}" show-cancel-button="focus" 
      style="padding-left:15px;"
      [(ngModel)]="searchText"
      (ionFocus)="onSearchFocus()"
      (ionCancel)="onSearchCancel()"
      (ionInput)="onSearchChanged()"
      [cancelButtonText]="ui.instant('Action.Cancel')"
    ></ion-searchbar>
    
    <ion-list>
        <ion-item *ngFor="let p of displayResult" 
        style="--padding-start:20px;--inner-padding-end:10px;" detail="false">
          <ion-thumbnail slot="start"
          style="display: flex;justify-content: center;align-items: center;">
            <img style="border-radius: 10px;" 
              defaultImage="assets/img/default.jpg" 
              lazyLoad="https://reddah.blob.core.windows.net/msjjpoet/{{p.author}}.jpeg"  
              onerror="javascript:this.src='assets/img/default.jpg'"
            />
          </ion-thumbnail>
          <ion-label>
            <h2 [innerHTML]="getHighlight(p)" class="show-only-one-line"></h2>
            <p style="margin-top:5px;display: flex;align-items: center;" 
            class="show-only-one-line">
              {{p.author}}《{{p.title}}》
              <ion-icon name="headset" *ngIf="p.audio" color="primary"></ion-icon>
            </p>
          </ion-label>
          <ion-button fill="clear" slot="end" (click)="addtocustomlist(p)" *ngIf="!isAddedToCurrentList(p)">
            <ion-icon name="add-circle-outline" color="danger" style="font-size:22px;"></ion-icon>
          </ion-button>
          <ion-button fill="clear" slot="end" *ngIf="isAddedToCurrentList(p)">
            <ion-icon name="checkmark-outline" color="danger" style="font-size:22px;"></ion-icon>
          </ion-button>
        </ion-item>
    </ion-list>
</ion-content>
